name: Claude Code Review

on:
  pull_request:
    # Model review is intentionally not triggered by synchronize events.
    # It is opt-in: the review gate adds `AI review: Claude` to the PR body only
    # when Claude is the chosen independent reviewer and the usage is warranted.
    types: [opened, ready_for_review]

jobs:
  claude-review:
    # Draft iteration should not spend model usage. A reviewable PR only enters
    # Claude review when the PR body explicitly requests it.
    if: >-
      (github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) &&
      contains(github.event.pull_request.body || '', 'AI review: Claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect reviewable changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const binaryExtensions = new Set([
              '.webp', '.png', '.jpg', '.jpeg', '.gif', '.wav', '.mp3', '.ico',
              '.ogg', '.mp4', '.mov', '.avi', '.webm', '.woff', '.woff2', '.ttf', '.otf'
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const reviewable = files.some(({ filename }) => {
              const extension = filename.includes('.')
                ? filename.slice(filename.lastIndexOf('.')).toLowerCase()
                : '';
              return !binaryExtensions.has(extension);
            });
            core.setOutput('has_reviewable_changes', reviewable.toString());
            core.info(`Reviewable changes: ${reviewable}`);

      - name: Skip Claude review for binary-only changes
        if: steps.changes.outputs.has_reviewable_changes != 'true'
        run: echo "No reviewable text changes; Claude review not required."

      - name: Run Claude Code Review
        id: claude-review
        if: steps.changes.outputs.has_reviewable_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
