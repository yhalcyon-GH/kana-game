name: Claude Code Review

on:
  pull_request:
    # Model review is intentionally not triggered by synchronize events.
    # It is opt-in: the review gate adds a dedicated `AI review: Claude` line
    # to the PR body only when Claude is the chosen independent reviewer and
    # the usage is warranted.
    types: [opened, ready_for_review]

jobs:
  claude-review:
    # Draft iteration should not spend model usage. Reviewable PRs enter this
    # cheap deterministic gate, but the model step only runs after an exact
    # dedicated-line opt-in check below.
    if: github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Detect exact Claude review opt-in
        id: opt_in
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'AI review: Claude';
            const hasExactMarkerLine = (body) =>
              (body ?? '').split(/\r?\n/).some((line) => line === marker);

            // Regression cases from the real PR #124 usage failure. Keep the
            // gate narrow: prose/negation must never opt in, while the exact
            // dedicated line must work with either LF or CRLF bodies.
            const cases = [
              ['', false],
              ['No AI review: Claude marker is requested.', false],
              ['AI review: Claude is not requested', false],
              ['prefix AI review: Claude suffix', false],
              ['AI review: Claude', true],
              ['summary\nAI review: Claude\nnotes', true],
              ['summary\r\nAI review: Claude\r\nnotes', true],
            ];
            for (const [body, expected] of cases) {
              const actual = hasExactMarkerLine(body);
              if (actual !== expected) {
                throw new Error(`Claude review opt-in matcher regression for ${JSON.stringify(body)}: expected ${expected}, got ${actual}`);
              }
            }

            const requested = hasExactMarkerLine(context.payload.pull_request?.body ?? '');
            core.setOutput('requested', requested.toString());
            core.info(`Claude review explicitly requested: ${requested}`);

      - name: Skip Claude review when not explicitly requested
        if: steps.opt_in.outputs.requested != 'true'
        run: echo "No exact 'AI review: Claude' marker line; Claude review not requested."

      - name: Detect reviewable changes
        id: changes
        if: steps.opt_in.outputs.requested == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const binaryExtensions = new Set([
              '.webp', '.png', '.jpg', '.jpeg', '.gif', '.wav', '.mp3', '.ico',
              '.ogg', '.mp4', '.mov', '.avi', '.webm', '.woff', '.woff2', '.ttf', '.otf'
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const reviewable = files.some(({ filename }) => {
              const extension = filename.includes('.')
                ? filename.slice(filename.lastIndexOf('.')).toLowerCase()
                : '';
              return !binaryExtensions.has(extension);
            });
            core.setOutput('has_reviewable_changes', reviewable.toString());
            core.info(`Reviewable changes: ${reviewable}`);

      - name: Skip Claude review for binary-only changes
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes != 'true'
        run: echo "No reviewable text changes; Claude review not required."

      - name: Checkout repository
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options