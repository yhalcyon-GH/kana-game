name: Claude Code Review

on:
  pull_request:
    # Model review is intentionally not triggered by synchronize events.
    # It is opt-in: the review gate adds a dedicated `AI review: Claude` line
    # to the PR body only when Claude is the chosen independent reviewer and
    # the usage is warranted. `edited` lets the gate opt in on the existing PR
    # after reviewing the finished diff, without a Draft -> Ready transition.
    types: [opened, ready_for_review, edited]

jobs:
  claude-review:
    # Draft/WIP iteration should not spend model usage. Reviewable PRs enter
    # this cheap deterministic gate, but the model step only runs after an
    # exact dedicated-line opt-in check below.
    if: github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Detect exact Claude review opt-in
        id: opt_in
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'AI review: Claude';
            const hasExactMarkerLine = (body) =>
              (body ?? '').split(/\r?\n/).some((line) => line === marker);

            const shouldRequestReview = (action, currentBody, previousBody = currentBody) => {
              if (!hasExactMarkerLine(currentBody)) return false;
              // On an edit, review only on the transition from no exact marker
              // to exact marker. This prevents unrelated edits or edits made
              // after a review request from spending model usage again.
              if (action === 'edited') return !hasExactMarkerLine(previousBody);
              return true;
            };

            // Deterministic regression cases from the real PR #124 usage
            // failure plus the Issue #139 single-PR opt-in transition.
            const lineCases = [
              ['', false],
              ['No AI review: Claude marker is requested.', false],
              ['AI review: Claude is not requested', false],
              ['prefix AI review: Claude suffix', false],
              ['AI review: Claude', true],
              ['summary\nAI review: Claude\nnotes', true],
              ['summary\r\nAI review: Claude\r\nnotes', true],
            ];
            for (const [body, expected] of lineCases) {
              const actual = hasExactMarkerLine(body);
              if (actual !== expected) {
                throw new Error(`Claude review exact-line matcher regression for ${JSON.stringify(body)}: expected ${expected}, got ${actual}`);
              }
            }

            const transitionCases = [
              ['opened', '', 'summary\nAI review: Claude', true],
              ['ready_for_review', '', 'AI review: Claude', true],
              ['edited', 'summary', 'summary\nAI review: Claude', true],
              ['edited', 'AI review: Claude', 'AI review: Claude\nnotes changed', false],
              ['edited', 'summary', 'No AI review: Claude marker is requested.', false],
              ['edited', 'AI review: Claude', 'summary', false],
              // Title-only edit: body did not change, so previous=current.
              ['edited', 'AI review: Claude', 'AI review: Claude', false],
            ];
            for (const [action, previousBody, currentBody, expected] of transitionCases) {
              const actual = shouldRequestReview(action, currentBody, previousBody);
              if (actual !== expected) {
                throw new Error(`Claude review transition regression for ${action}: expected ${expected}, got ${actual}`);
              }
            }

            const action = context.payload.action;
            const currentBody = context.payload.pull_request?.body ?? '';
            const changes = context.payload.changes ?? {};
            const bodyChanged = Object.prototype.hasOwnProperty.call(changes, 'body');
            // For an edited event that did not change the body (for example a
            // title edit), treat previous body as current body so it cannot
            // create a false no-marker -> marker transition.
            const previousBody = bodyChanged ? (changes.body?.from ?? '') : currentBody;
            const requested = shouldRequestReview(action, currentBody, previousBody);

            core.setOutput('requested', requested.toString());
            core.info(`Claude review explicitly requested on this event: ${requested}`);

      - name: Skip Claude review when not explicitly requested
        if: steps.opt_in.outputs.requested != 'true'
        run: echo "No new exact Claude-review opt-in line; model review not requested."

      - name: Detect reviewable changes
        id: changes
        if: steps.opt_in.outputs.requested == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const binaryExtensions = new Set([
              '.webp', '.png', '.jpg', '.jpeg', '.gif', '.wav', '.mp3', '.ico',
              '.ogg', '.mp4', '.mov', '.avi', '.webm', '.woff', '.woff2', '.ttf', '.otf'
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const reviewable = files.some(({ filename }) => {
              const extension = filename.includes('.')
                ? filename.slice(filename.lastIndexOf('.')).toLowerCase()
                : '';
              return !binaryExtensions.has(extension);
            });
            core.setOutput('has_reviewable_changes', reviewable.toString());
            core.info(`Reviewable changes: ${reviewable}`);

      - name: Skip Claude review for binary-only changes
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes != 'true'
        run: echo "No reviewable text changes; Claude review not required."

      - name: Checkout repository
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: steps.opt_in.outputs.requested == 'true' && steps.changes.outputs.has_reviewable_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
