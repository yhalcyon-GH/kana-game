name: Issue 159 correct MP3 sync audit

on:
  push:
    branches:
      - issue-159-runtime-audio-mp3-final

permissions:
  contents: write

jobs:
  correct-audit:
    if: ${{ !contains(github.event.head_commit.message, '[audio-audit-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct current-main rename metadata
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/history/asset-audits/asset-optimization-audio-rollout-2026-09-01.json')
          detail = json.loads(path.read_text(encoding='utf-8'))
          mappings = detail.get('main_sync', {}).get('runtime_path_renames', [])
          matches = [m for m in mappings if m.get('from') == 'words/wa-tonkatsu.mp3']
          if len(matches) != 1:
              raise SystemExit(f'expected one wa-tonkatsu mapping, found {len(matches)}')
          matches[0]['to'] = 'words/ta-tonkatsu.mp3'
          path.write_text(json.dumps(detail, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          if len(mappings) != 13:
              raise SystemExit(f'expected 13 current-main rename mappings, found {len(mappings)}')
          if not Path('public/audio/words/ta-tonkatsu.mp3').is_file():
              raise SystemExit('ta-tonkatsu MP3 missing')
          if Path('public/audio/words/ra-tonkatsu.mp3').exists():
              raise SystemExit('unexpected ra-tonkatsu MP3 exists')
          PY
          git diff --check
      - name: Commit audit correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/history/asset-audits/asset-optimization-audio-rollout-2026-09-01.json
          git commit -m 'docs: correct MP3 current-main rename metadata [audio-audit-fix-complete]'
          git push origin HEAD:issue-159-runtime-audio-mp3-final
