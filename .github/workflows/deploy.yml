name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          # All optional and safe to leave unset: the app falls back to its
          # feedback-hidden / analytics-no-op behavior when these are blank.
          # None of these are secrets — a feedback form URL and a Umami
          # website id are public client-side values by design (see
          # docs/feedback-setup.md and
          # docs/feedback-analytics-provider-decision.md) — so plain
          # repository/environment Variables (Settings → Secrets and
          # variables → Actions → Variables) are the right place for them,
          # not Secrets.
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_HOST_URL: ${{ vars.VITE_UMAMI_HOST_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
