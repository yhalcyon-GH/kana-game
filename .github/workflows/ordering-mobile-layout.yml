name: Ordering Mobile Layout

on:
  pull_request:
    paths:
      - 'src/routes/games/RestaurantPage.tsx'
      - 'src/routes/games/CafePage.tsx'
      - 'src/App.tsx'
      - 'src/index.css'
      - 'scripts/checkOrderingLayout.mjs'
      - '.github/workflows/ordering-mobile-layout.yml'

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/checkOrderingLayout.mjs
