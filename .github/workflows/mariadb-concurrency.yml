name: MariaDB Concurrency Verification

# Diagnostic-only workflow -- see server/tests/mariadb-concurrency/README.md.
# Runs real, genuinely concurrent PHP worker PROCESSES (never threads, never
# sequential calls on one shared connection) against a disposable MariaDB
# service container that exists only for the duration of this job. Never
# connects to, or uses any credential from, Production in any way.
#
# Kept entirely separate from PR Verify / Browser Smoke -- this exercises a
# different kind of risk (real multi-connection database concurrency, not
# frontend behavior or the SQLite-backed unit suite) and is allowed to take
# longer / be run on demand via workflow_dispatch.

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/mariadb-concurrency.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per scenario'
        required: false
        default: '20'

permissions:
  contents: read

jobs:
  mariadb-concurrency:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # server/sql/migrations/0001_users_auth_foundation.sql and
        # 0002_purchase_attribution.sql both state "MariaDB 10.5+" as the
        # minimum required version -- no exact Production version is
        # recorded anywhere in this repository (confirmed by inspection
        # before writing this workflow). 10.11 is the verification
        # baseline per the task brief; 10.5 is also run, matching the
        # repository's own stated minimum, since running both was not
        # unstable to add.
        mariadb-version: ['10.11', '10.5']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          # Bootstrap-only root credential for this ephemeral, disposable
          # container -- NOT a Production credential, NOT a GitHub Secret,
          # thrown away when this job ends. The actual credential
          # orchestrate.php connects with is a fresh, randomly generated
          # value created in the "Create ephemeral test database/user"
          # step below, never this one.
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli

      - name: Wait for MariaDB to accept connections
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -p"${MARIADB_ROOT_PASSWORD}" --silent; then
              echo "MariaDB is ready"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done
          echo "MariaDB never became ready"
          exit 1
        env:
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root-not-a-secret

      - name: Create ephemeral test database/user (generated in-workflow, never a secret)
        run: |
          set -euo pipefail
          APP_DB_NAME="kana_game_concurrency_test"
          APP_DB_USER="concurrency_test_user"
          APP_DB_PASSWORD="$(openssl rand -hex 24)"

          mysql -h127.0.0.1 -uroot -p"${MARIADB_ROOT_PASSWORD}" <<SQL
          CREATE DATABASE ${APP_DB_NAME} CHARACTER SET utf8mb4;
          CREATE USER '${APP_DB_USER}'@'%' IDENTIFIED BY '${APP_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON ${APP_DB_NAME}.* TO '${APP_DB_USER}'@'%';
          FLUSH PRIVILEGES;
          SQL

          {
            echo "MARIADB_CONCURRENCY_DB_HOST=127.0.0.1"
            echo "MARIADB_CONCURRENCY_DB_NAME=${APP_DB_NAME}"
            echo "MARIADB_CONCURRENCY_DB_USER=${APP_DB_USER}"
          } >> "$GITHUB_ENV"
          # The password is intentionally NOT echoed anywhere, including
          # into a log-visible step -- written straight to GITHUB_ENV via
          # a masked add-mask directive so later steps can use it without
          # it ever appearing in the workflow's own log output.
          echo "::add-mask::${APP_DB_PASSWORD}"
          echo "MARIADB_CONCURRENCY_DB_PASSWORD=${APP_DB_PASSWORD}" >> "$GITHUB_ENV"
        env:
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root-not-a-secret

      - name: Apply schema and migrations (fresh disposable DB, never Production)
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -u"${MARIADB_CONCURRENCY_DB_USER}" -p"${MARIADB_CONCURRENCY_DB_PASSWORD}" "${MARIADB_CONCURRENCY_DB_NAME}" < server/sql/schema.sql
          for migration in server/sql/migrations/*.sql; do
            echo "Applying $migration"
            mysql -h127.0.0.1 -u"${MARIADB_CONCURRENCY_DB_USER}" -p"${MARIADB_CONCURRENCY_DB_PASSWORD}" "${MARIADB_CONCURRENCY_DB_NAME}" < "$migration"
          done

      - name: Run MariaDB concurrency verification harness
        run: php server/tests/mariadb-concurrency/orchestrate.php --iterations="${{ github.event.inputs.iterations || '20' }}"
