name: Pre-Live Safety

on:
  # This is a required ruleset check. It must report a result for every PR,
  # including documentation-only changes, or GitHub blocks an otherwise-safe merge
  # with the check in an expected/pending state.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/checkPreLiveSafety.mjs'
      - 'scripts/productionReadOnlySsh.mjs'
      - 'scripts/productionReleaseIntegrity.mjs'
      - 'server/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'

permissions:
  contents: read

jobs:
  pre-live-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checkPreLiveSafety.mjs
