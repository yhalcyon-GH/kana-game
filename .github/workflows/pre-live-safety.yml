name: Pre-Live Safety

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/checkPreLiveSafety.mjs'
      - 'scripts/productionReadOnlySsh.mjs'
      - 'scripts/productionReadOnlyPreflight.mjs'
      - 'server/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/checkPreLiveSafety.mjs'
      - 'scripts/productionReadOnlySsh.mjs'
      - 'scripts/productionReadOnlyPreflight.mjs'
      - 'server/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'

permissions:
  contents: read

jobs:
  pre-live-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checkPreLiveSafety.mjs
