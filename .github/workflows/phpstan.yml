name: PHPStan

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/phpstan.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/phpstan.yml'

permissions:
  contents: read

env:
  PHPSTAN_VERSION: 2.2.13
  PHPSTAN_URL: https://github.com/phpstan/phpstan/releases/download/2.2.13/phpstan.phar
  PHPSTAN_SHA256: a3293d850a9966fbef43e39d04f2b081b8eec35839126c43a54684f21b10ad69

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Download PHPStan PHAR
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output phpstan.phar \
            "$PHPSTAN_URL"

      - name: Verify PHPStan PHAR SHA-256 before executing it
        run: echo "${PHPSTAN_SHA256}  phpstan.phar" | sha256sum --check --strict

      - name: Run PHPStan against server/src and server/auth
        run: php phpstan.phar analyse --configuration=server/phpstan.neon --no-progress
