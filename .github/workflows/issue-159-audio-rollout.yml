name: Issue 159 audio rollout

on:
  push:
    branches:
      - issue-159-runtime-audio-mp3-rollout

permissions:
  contents: write

jobs:
  rollout:
    if: ${{ !contains(github.event.head_commit.message, '[audio-rollout-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Convert and validate all 518 runtime WAVs
        run: |
          set -euo pipefail
          python3 <<'PY'
          import array
          import json
          import math
          import os
          import pathlib
          import subprocess
          import wave

          AUDIO = pathlib.Path('public/audio')
          REPORT_DIR = pathlib.Path('docs/history/asset-audits')
          REPORT_DIR.mkdir(parents=True, exist_ok=True)
          EXPECTED_COUNT = 518
          EXPECTED_BYTES = 49_373_726
          FRAME_MS = 5
          BOUNDARY_THRESHOLDS_DBFS = (-35.0, -40.0, -45.0)
          BOUNDARY_LIMIT_S = 0.020
          APPROVED_BOUNDARY_LIMIT_S = 0.050
          APPROVED_SAMPLE_DELTA_LIMIT = 50
          HUMAN_APPROVED_OUTLIERS = {
              'characters/chi.wav',
              'characters/kyu.wav',
              'feedback/correct_seikai.wav',
              'guide/chouon-8.wav',
              'restaurant/hiragana/misoshiru.wav',
              'restaurant/hiragana/tonkatsu.wav',
              'restaurant/katakana/zerii.wav',
              'words/special-katakana-fa-paatii.wav',
              'words/wa-tenpura.wav',
              'words/youon-sha-juu.wav',
          }

          def run(cmd):
              return subprocess.run(cmd, check=True, text=True, capture_output=True)

          def probe(path):
              data = json.loads(run([
                  'ffprobe', '-v', 'error', '-select_streams', 'a:0',
                  '-show_entries', 'stream=codec_name,sample_rate,channels',
                  '-show_entries', 'format=duration,size', '-of', 'json', str(path)
              ]).stdout)
              s = data['streams'][0]
              f = data['format']
              return {
                  'codec': s['codec_name'],
                  'sample_rate': int(s['sample_rate']),
                  'channels': int(s['channels']),
                  'duration': float(f['duration']),
                  'size': int(f['size']),
              }

          def read_wav(path):
              with wave.open(str(path), 'rb') as w:
                  if w.getnchannels() != 1 or w.getsampwidth() != 2:
                      raise RuntimeError(f'expected PCM16 mono WAV: {path}')
                  rate = w.getframerate()
                  raw = w.readframes(w.getnframes())
              a = array.array('h')
              a.frombytes(raw)
              if os.sys.byteorder != 'little':
                  a.byteswap()
              return rate, a

          def decode_mp3(path, rate):
              p = subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-nostdin',
                  '-i', str(path), '-f', 's16le', '-acodec', 'pcm_s16le',
                  '-ac', '1', '-ar', str(rate), 'pipe:1'
              ], check=True, capture_output=True)
              a = array.array('h')
              a.frombytes(p.stdout)
              if os.sys.byteorder != 'little':
                  a.byteswap()
              return a

          def rms(frame):
              return math.sqrt(sum(v * v for v in frame) / len(frame)) if frame else 0.0

          def edge_rms(samples, rate, threshold_dbfs):
              n = max(1, round(rate * FRAME_MS / 1000))
              threshold = 32767 * (10 ** (threshold_dbfs / 20))
              starts = list(range(0, len(samples), n))
              active = []
              for start in starts:
                  end = min(len(samples), start + n)
                  if rms(samples[start:end]) > threshold:
                      active.append((start, end))
              if not active:
                  d = len(samples) / rate
                  return d, d
              return active[0][0] / rate, (len(samples) - active[-1][1]) / rate

          wavs = sorted(AUDIO.rglob('*.wav'))
          before_bytes = sum(p.stat().st_size for p in wavs)
          if len(wavs) != EXPECTED_COUNT:
              raise SystemExit(f'expected {EXPECTED_COUNT} WAVs, found {len(wavs)}')
          if before_bytes != EXPECTED_BYTES:
              raise SystemExit(f'expected {EXPECTED_BYTES} WAV bytes, found {before_bytes}')

          ffmpeg_version = run(['ffmpeg', '-version']).stdout.splitlines()[0]
          rows = []
          outliers = []
          max_lead = 0.0
          max_trail = 0.0

          for idx, src in enumerate(wavs, 1):
              rel = src.relative_to(AUDIO).as_posix()
              dst = src.with_suffix('.mp3')
              src_probe = probe(src)
              rate, original = read_wav(src)
              if src_probe['channels'] != 1 or src_probe['sample_rate'] != rate:
                  raise SystemExit(f'invalid source metadata: {rel}')
              if rate not in (24000, 44100):
                  raise SystemExit(f'unexpected source rate {rate}: {rel}')

              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-nostdin', '-y',
                  '-i', str(src), '-c:a', 'libmp3lame', '-b:a', '96k',
                  '-ar', str(rate), '-ac', '1', str(dst)
              ], check=True)

              p = probe(dst)
              if p['codec'] != 'mp3' or p['channels'] != 1 or p['sample_rate'] != rate:
                  raise SystemExit(f'invalid MP3 metadata: {rel}: {p}')

              decoded = decode_mp3(dst, rate)
              flags = []
              sample_delta = len(decoded) - len(original)
              if sample_delta != 0:
                  flags.append(f'decoded sample count changed {len(original)} -> {len(decoded)}')

              boundary = {}
              per_file_max_boundary = 0.0
              for db in BOUNDARY_THRESHOLDS_DBFS:
                  sl, st = edge_rms(original, rate, db)
                  dl, dt = edge_rms(decoded, rate, db)
                  lead = dl - sl
                  trail = dt - st
                  per_file_max_boundary = max(per_file_max_boundary, abs(lead), abs(trail))
                  max_lead = max(max_lead, abs(lead))
                  max_trail = max(max_trail, abs(trail))
                  boundary[str(int(db))] = {
                      'lead_delta_s': round(lead, 6),
                      'trail_delta_s': round(trail, 6),
                  }
                  if abs(lead) > BOUNDARY_LIMIT_S + 1e-9:
                      flags.append(f'lead {FRAME_MS}ms RMS boundary delta {lead:.6f}s at {db:.0f}dBFS')
                  if abs(trail) > BOUNDARY_LIMIT_S + 1e-9:
                      flags.append(f'trail {FRAME_MS}ms RMS boundary delta {trail:.6f}s at {db:.0f}dBFS')

              src_peak = max((abs(v) for v in original), default=0)
              dec_peak = max((abs(v) for v in decoded), default=0)
              new_clipping = dec_peak >= 32767 and src_peak < 32767
              if new_clipping:
                  flags.append('new PCM clipping')

              row = {
                  'path': rel,
                  'source_rate': rate,
                  'source_bytes': src.stat().st_size,
                  'mp3_bytes': dst.stat().st_size,
                  'source_samples': len(original),
                  'decoded_samples': len(decoded),
                  'sample_delta': sample_delta,
                  'source_peak': src_peak,
                  'decoded_peak': dec_peak,
                  'new_clipping': new_clipping,
                  'boundary_deltas': boundary,
                  'human_approved_exception': rel in HUMAN_APPROVED_OUTLIERS,
              }
              rows.append(row)
              if flags:
                  outliers.append({
                      'path': rel,
                      'flags': flags,
                      'sample_delta': sample_delta,
                      'max_boundary_delta_s': per_file_max_boundary,
                      'new_clipping': new_clipping,
                  })
              if idx % 50 == 0 or idx == len(wavs):
                  print(f'validated {idx}/{len(wavs)}')

          mp3s = sorted(AUDIO.rglob('*.mp3'))
          if len(mp3s) != EXPECTED_COUNT:
              raise SystemExit(f'expected {EXPECTED_COUNT} MP3s, found {len(mp3s)}')

          unexpected = []
          approved_seen = []
          for outlier in outliers:
              rel = outlier['path']
              if rel not in HUMAN_APPROVED_OUTLIERS:
                  unexpected.append(outlier)
                  continue
              if outlier['new_clipping']:
                  unexpected.append(outlier)
                  continue
              if abs(outlier['sample_delta']) > APPROVED_SAMPLE_DELTA_LIMIT:
                  unexpected.append(outlier)
                  continue
              if outlier['max_boundary_delta_s'] > APPROVED_BOUNDARY_LIMIT_S + 1e-9:
                  unexpected.append(outlier)
                  continue
              approved_seen.append(outlier)

          if unexpected:
              print(json.dumps(unexpected, ensure_ascii=False, indent=2))
              raise SystemExit(f'{len(unexpected)} unapproved audio outlier(s); refusing to remove WAVs')

          after_bytes = sum(p.stat().st_size for p in mp3s)
          reduction = 1 - after_bytes / before_bytes
          detail = {
              'date': '2026-09-01',
              'ffmpeg_version': ffmpeg_version,
              'recipe': 'libmp3lame 96 kbps CBR, mono, preserve source sample rate, no normalization/remastering',
              'source_count': len(wavs),
              'source_bytes': before_bytes,
              'mp3_count': len(mp3s),
              'mp3_bytes': after_bytes,
              'reduction_fraction': reduction,
              'boundary_measurement': f'{FRAME_MS} ms RMS frames at {BOUNDARY_THRESHOLDS_DBFS} dBFS',
              'boundary_limit_s': BOUNDARY_LIMIT_S,
              'human_approved_boundary_limit_s': APPROVED_BOUNDARY_LIMIT_S,
              'human_approved_sample_delta_limit': APPROVED_SAMPLE_DELTA_LIMIT,
              'human_approved_paths': sorted(HUMAN_APPROVED_OUTLIERS),
              'human_approved_outliers_seen': approved_seen,
              'max_abs_leading_boundary_delta_s': max_lead,
              'max_abs_trailing_boundary_delta_s': max_trail,
              'new_clipping_count': sum(r['new_clipping'] for r in rows),
              'rows': rows,
          }
          (REPORT_DIR / 'asset-optimization-audio-rollout-2026-09-01.json').write_text(
              json.dumps(detail, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          automated_clean_count = len(mp3s) - len(approved_seen)
          md = f'''# Runtime audio MP3 rollout (Issue #159)\n\n- Starting WAV inventory: **{len(wavs)} files / {before_bytes:,} bytes**\n- Production MP3 inventory: **{len(mp3s)} files / {after_bytes:,} bytes**\n- Actual reduction: **{reduction * 100:.1f}%** ({before_bytes - after_bytes:,} bytes saved)\n- Encoder: `{ffmpeg_version}`\n- Recipe: `libmp3lame`, 96 kbps CBR, mono, preserve each source's 44.1 kHz or 24 kHz rate\n- Source: current mastered WAVs; **no re-normalization, EQ, gain, trimming, or dynamics processing**\n\n## Whole-corpus validation\n\nAll {len(mp3s)} files passed the production gate.\n\nFor the **{automated_clean_count} files without a human-approved exception**, automation confirmed:\n\n- MP3 decode success\n- mono and source sample-rate preservation\n- exact decoded PCM sample-count preservation\n- no newly introduced PCM clipping\n- 5 ms RMS onset/ending boundary checks at -35/-40/-45 dBFS, each within 20 ms\n- one MP3 for every source WAV relative path\n\nFor the **{len(approved_seen)} automated outliers**, the exact A/B pairs were human-listened after the gate surfaced them. All were confirmed acceptable: no onset/end truncation, no click/pop, and no obvious pronunciation or quality degradation. The approved exception set is limited to the 10 reviewed paths and only allows the observed small sample-count/boundary differences; clipping, metadata/decode failures, a new path, >50 sample delta, or >50 ms boundary delta still fails automatically.\n\nMaximum observed boundary deltas across all files and all three thresholds:\n\n- leading: **{max_lead * 1000:.2f} ms**\n- trailing: **{max_trail * 1000:.2f} ms**\n- new clipping: **0 files**\n\nEarlier single-threshold gates also flagged seven files (`pyu`, `a-ie`, `sokuon-iki`, `ni`, `nu`, `ro`, `so`). Targeted automated diagnostics showed threshold-dependent/frame-quantized boundary flips rather than consistent onset/end loss; those were resolved mechanically and did not require human listening.\n\n## Runtime integration\n\n`StaticFileProvider` changes from `.wav` to `.mp3`, with its URL contract test updated. Existing Workbox runtime caching matches `/audio/` independent of extension, so no cache-policy change is needed.\n\n## Verification policy\n\nHuman verification is risk-based. Broad listening or routine physical-device checks are not required when whole-corpus and runtime-integration automation passes; escalate only a concrete unresolved anomaly. The 10 outliers above were escalated because automation could not conclusively classify them, and all 10 passed targeted listening.\n'''
          (REPORT_DIR / 'asset-optimization-audio-rollout-2026-09-01.md').write_text(md, encoding='utf-8')

          # Only after all 518 candidates pass the gate.
          for src in wavs:
              src.unlink()

          print(f'MP3_BYTES={after_bytes}')
          print(f'REDUCTION={reduction * 100:.3f}%')
          print(f'APPROVED_OUTLIERS={len(approved_seen)}')
          print(f'MAX_LEAD_DELTA_MS={max_lead * 1000:.3f}')
          print(f'MAX_TRAIL_DELTA_MS={max_trail * 1000:.3f}')
          PY

      - name: Update runtime references and generator safeguard
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          provider = Path('src/audio/staticFileProvider.ts')
          text = provider.read_text(encoding='utf-8')
          old = 'audio/${request.key}.wav`'
          if old not in text:
              raise SystemExit('StaticFileProvider WAV reference not found')
          provider.write_text(text.replace(old, 'audio/${request.key}.mp3`'), encoding='utf-8')

          test = Path('src/audio/staticFileProvider.test.ts')
          text = test.read_text(encoding='utf-8')
          if 'audio/characters/ka.wav' not in text:
              raise SystemExit('provider test WAV expectation not found')
          test.write_text(text.replace('audio/characters/ka.wav', 'audio/characters/ka.mp3'), encoding='utf-8')

          curriculum_test = Path('src/data/curriculum.test.ts')
          text = curriculum_test.read_text(encoding='utf-8')
          old_description = "it('a WAV file exists on disk for each of the 12 audio ids', () => {"
          old_path = "`${audioId}.wav`"
          if old_description not in text or old_path not in text:
              raise SystemExit('curriculum WAV audio assertion not found')
          text = text.replace(old_description, "it('an MP3 file exists on disk for each of the 12 audio ids', () => {")
          text = text.replace(old_path, "`${audioId}.mp3`", 1)
          curriculum_test.write_text(text, encoding='utf-8')

          quiz_test = Path('src/routes/games/KanaQuizPage.test.tsx')
          text = quiz_test.read_text(encoding='utf-8')
          old_comment = 'round-start autoplay — its .src encodes "characters/<id>.wav",'
          old_regex = r'promptAudio.src.match(/\/audio\/characters\/([^/]+)\.wav$/)'
          if old_comment not in text or old_regex not in text:
              raise SystemExit('KanaQuiz WAV URL assertion not found')
          text = text.replace(old_comment, 'round-start autoplay — its .src encodes "characters/<id>.mp3",')
          text = text.replace(old_regex, r'promptAudio.src.match(/\/audio\/characters\/([^/]+)\.mp3$/)')
          quiz_test.write_text(text, encoding='utf-8')

          gen = Path('scripts/generateAudioElevenLabs.ts')
          text = gen.read_text(encoding='utf-8')
          old_block = '''    const outPath = path.join(dir, `${id}.wav`)\n    if (await fileExists(outPath)) {\n      console.log(`  skip ${subdir}/${id}.wav (already exists)`)\n      continue\n    }\n'''
          new_block = '''    const outPath = path.join(dir, `${id}.wav`)\n    const productionMp3Path = path.join(dir, `${id}.mp3`)\n    if (await fileExists(outPath) || await fileExists(productionMp3Path)) {\n      console.log(`  skip ${subdir}/${id} (runtime clip already exists)`)\n      continue\n    }\n'''
          if old_block not in text:
              raise SystemExit('generator skip block not found')
          gen.write_text(text.replace(old_block, new_block), encoding='utf-8')
          PY

      - name: Integration checks
        run: |
          set -euo pipefail
          test "$(find public/audio -type f -name '*.mp3' | wc -l)" -eq 518
          test "$(find public/audio -type f -name '*.wav' | wc -l)" -eq 0
          grep -q 'audio/${request.key}.mp3' src/audio/staticFileProvider.ts
          grep -q 'audio/characters/ka.mp3' src/audio/staticFileProvider.test.ts
          ! grep -R -nE "audio/[^\"'[:space:]]+\.wav|request\.key\}\.wav" src --include='*.ts' --include='*.tsx'
          grep -q '/\\/audio\\//' vite.config.ts
          echo 'Remaining script WAV references (informational; source generators may intentionally emit WAV):'
          grep -R -n '\.wav' scripts --include='*.ts' --include='*.mjs' || true

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Diff checks
        run: |
          git diff --check
          git add -A
          git diff --cached --check

      - name: Commit rollout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "feat: roll out MP3 runtime audio [audio-rollout-complete]"
          git push origin HEAD:issue-159-runtime-audio-mp3-rollout
