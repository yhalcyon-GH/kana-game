name: Issue 159 package patched rollout workflow

on:
  push:
    branches:
      - issue-159-verify-diagnostics

permissions:
  contents: read

jobs:
  package-rollout-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch helper
        uses: actions/checkout@v4
        with:
          ref: issue-159-verify-diagnostics
          path: helper

      - name: Checkout rollout branch
        uses: actions/checkout@v4
        with:
          ref: issue-159-runtime-audio-mp3-rollout
          path: target

      - name: Apply verified patch
        run: |
          python3 helper/scripts/issue159PatchRolloutWorkflow.py target/.github/workflows/issue-159-audio-rollout.yml
          git -C target diff --check

      - name: Upload patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: issue-159-patched-rollout-workflow
          path: target/.github/workflows/issue-159-audio-rollout.yml
          if-no-files-found: error
