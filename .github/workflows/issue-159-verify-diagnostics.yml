name: Issue 159 apply verified rollout fixes

on:
  push:
    branches:
      - issue-159-verify-diagnostics

permissions:
  contents: write

jobs:
  patch-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch helper
        uses: actions/checkout@v4
        with:
          ref: issue-159-verify-diagnostics
          path: helper

      - name: Checkout rollout branch
        uses: actions/checkout@v4
        with:
          ref: issue-159-runtime-audio-mp3-rollout
          fetch-depth: 0
          path: target

      - name: Apply verified patch
        run: python3 helper/scripts/issue159PatchRolloutWorkflow.py target/.github/workflows/issue-159-audio-rollout.yml

      - name: Commit rollout workflow fix
        working-directory: target
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/issue-159-audio-rollout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue-159-audio-rollout.yml
          git commit -m "chore: fix MP3 rollout test assumptions"
          git push origin HEAD:issue-159-runtime-audio-mp3-rollout
