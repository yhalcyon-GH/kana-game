name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Claude may act only on an explicit @claude instruction from this
    # repository's owner. This prevents public comments and reviews from
    # consuming the configured Claude account or exercising write permissions.
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Required by claude-code-action to obtain its short-lived GitHub token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Keep shell access limited to dependency installation, project verification,
          # PR operations required by repository tasks, and GitHub Agentic Workflows
          # authoring/compilation. gh-aw is intentionally limited to setup/validation/
          # compile operations; workflow execution and arbitrary extension management
          # remain disallowed.
          claude_args: >-
            --allowed-tools
            "Bash(npm ci),
            Bash(npm test),
            Bash(npm run lint),
            Bash(npm run build),
            Bash(npm run verify),
            Bash(gh pr create:*),
            Bash(gh pr edit:*),
            Bash(gh pr ready:*),
            Bash(gh extension install github/gh-aw:*),
            Bash(gh aw version),
            Bash(gh aw doctor:*),
            Bash(gh aw init:*),
            Bash(gh aw add:*),
            Bash(gh aw compile:*)"
