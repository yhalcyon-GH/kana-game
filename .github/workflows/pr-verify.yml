name: PR Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check PR diff for whitespace errors
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
      - name: PHP syntax check (php -l)
        # A fast, unconditional sanity sweep on every PR -- not a
        # substitute for server-unit-tests.yml (real behavior) or
        # phpstan.yml (real static analysis), both scoped to server/**.
        run: find server -name '*.php' -print0 | xargs -0 -n1 -- php -l
