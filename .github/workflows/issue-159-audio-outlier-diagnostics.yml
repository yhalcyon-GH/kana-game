name: Issue 159 audio listening set

on:
  push:
    branches:
      - issue-159-audio-outlier-diagnostics

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build 10-file A/B listening set
        run: |
          set -euo pipefail
          mkdir -p review-set/original review-set/mp3

          while IFS='|' read -r n rel; do
            [ -n "$n" ] || continue
            src="public/audio/$rel"
            stem="${n}_$(basename "${rel%.wav}")"
            cp "$src" "review-set/original/${stem}.wav"
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$src")"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" \
              -c:a libmp3lame -b:a 96k -ar "$rate" -ac 1 \
              "review-set/mp3/${stem}.mp3"
          done <<'EOF'
          01|characters/chi.wav
          02|characters/kyu.wav
          03|feedback/correct_seikai.wav
          04|guide/chouon-8.wav
          05|restaurant/hiragana/misoshiru.wav
          06|restaurant/hiragana/tonkatsu.wav
          07|restaurant/katakana/zerii.wav
          08|words/special-katakana-fa-paatii.wav
          09|words/wa-tenpura.wav
          10|words/youon-sha-juu.wav
          EOF

          cat > review-set/README.txt <<'EOF'
          KanaGame Issue #159 — 10-file A/B listening set

          Compare files with the same number in:
            original/ = current mastered WAV
            mp3/      = proposed production MP3 (libmp3lame 96 kbps CBR, mono, source sample rate preserved)

          Please only check whether the MP3 has a concrete audible problem versus the WAV:
          - beginning cut/delayed
          - ending cut/extra sound
          - click/pop
          - obvious pronunciation or quality degradation

          A simple result like "10本とも問題なし" is enough if all pass.
          If one differs, report only its number and what you heard.
          EOF

          sha256sum review-set/original/* review-set/mp3/* > review-set/SHA256SUMS.txt
          find review-set -type f -maxdepth 2 -print | sort

      - name: Upload listening set
        uses: actions/upload-artifact@v4
        with:
          name: issue-159-10-audio-listening-set
          path: review-set
          if-no-files-found: error
          retention-days: 7
