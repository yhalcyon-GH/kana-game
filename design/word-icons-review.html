<title>単語イラスト確認</title>
<style>
:root {
  --bg: #f4f4f0;
  --surface: #ffffff;
  --ink: #1f2321;
  --ink-soft: #5b615c;
  --border: #e0e0da;
  --accent: #3f6f76;
  --accent-soft: #e4eeee;
  --mono: #767c76;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #15181a;
    --surface: #1d2225;
    --ink: #e9ebe6;
    --ink-soft: #a3aaa4;
    --border: #2c3236;
    --accent: #7fb8bf;
    --accent-soft: #22383b;
    --mono: #7c837e;
  }
}
:root[data-theme='dark'] {
  --bg: #15181a;
  --surface: #1d2225;
  --ink: #e9ebe6;
  --ink-soft: #a3aaa4;
  --border: #2c3236;
  --accent: #7fb8bf;
  --accent-soft: #22383b;
  --mono: #7c837e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', system-ui, sans-serif;
  line-height: 1.5;
}
header {
  padding: 2.5rem 2rem 1.5rem;
  max-width: 72rem;
  margin: 0 auto;
}
h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin: 0 0 0.4rem;
  letter-spacing: 0.01em;
}
.sub {
  color: var(--ink-soft);
  font-size: 0.95rem;
  margin: 0;
}
main {
  max-width: 72rem;
  margin: 0 auto;
  padding: 0 2rem 4rem;
}
.cat {
  margin-top: 2.25rem;
}
.cat h2 {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.cat-label { color: var(--ink); }
.cat-count {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
  gap: 0.9rem;
}
.card {
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0.7rem;
  overflow: hidden;
}
.thumb {
  aspect-ratio: 1;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
figcaption {
  padding: 0.5rem 0.6rem 0.65rem;
  display: flex;
  flex-direction: column;
  gap: 0.05rem;
}
.kana { font-size: 1.05rem; font-weight: 700; }
.romaji { font-size: 0.75rem; color: var(--ink-soft); }
.meaning { font-size: 0.78rem; color: var(--ink-soft); }
.id {
  margin-top: 0.3rem;
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  font-size: 0.65rem;
  color: var(--mono);
  overflow-wrap: anywhere;
}
</style>
